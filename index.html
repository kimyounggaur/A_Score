<script type="text/babel">
const { useState, useEffect, useRef } = React;

try { localStorage.removeItem('ss_page'); } catch (e) {}

function parseHash() {
  const raw = window.location.hash.replace(/^#\/?/, '');
  const [name = '', encodedParam = null] = raw.split('/');
  let param = null;
  try { param = encodedParam ? decodeURIComponent(encodedParam) : null; } catch (e) {}
  return { name: name || 'home', param };
}

function useHashRoute() {
  const [route, setRoute] = useState(parseHash);
  useEffect(() => {
    const onChange = () => { setRoute(parseHash()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', onChange);
    return () => window.removeEventListener('hashchange', onChange);
  }, []);
  return route;
}

const go = (path) => {
  const next = path.startsWith('/') ? path : '/' + path;
  if (window.location.hash === '#' + next) window.scrollTo(0, 0);
  else window.location.hash = next;
};

function useMediaQuery(query) {
  const [matches, setMatches] = useState(() => window.matchMedia(query).matches);
  useEffect(() => {
    const mq = window.matchMedia(query);
    const onChange = (event) => setMatches(event.matches);
    mq.addEventListener('change', onChange);
    return () => mq.removeEventListener('change', onChange);
  }, [query]);
  return matches;
}

const won = (n) => '₩' + new Intl.NumberFormat('ko-KR').format(Number(n) || 0);
const discountRate = (price, sale) =>
  (sale != null && price > 0 && sale < price) ? Math.floor(((price - sale) * 100) / price) : 0;
const clampPoints = (value, balance, payable) => {
  const n = Math.floor(Number(value));
  if (!Number.isFinite(n) || n <= 0) return 0;
  return Math.min(n, Math.max(0, balance), Math.max(0, payable));
};

function createOrderNo() {
  const kst = new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date()).replaceAll('-', '');
  const rand = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, '0');
  return `${kst}-${rand}`;
}

function historyBackOrHome() {
  if (history.length > 1) history.back();
  else go('/');
}

        <nav aria-label="주요 메뉴" style={{ display: 'flex', gap: 4, flex: 1 }} className="desktop-nav">

            <a key={item.key} href={item.href} style={{
              padding: '6px 10px', borderRadius: 8, textDecoration: 'none',
              fontSize: 14, fontWeight: 500,
              color: item.accent || currentPage === item.key ? 'var(--accent-strong)' : '#334155',
              fontFamily: 'inherit', transition: 'background 150ms'
            }}>{item.label}</a>
          ))}
        </nav>

        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginLeft: 'auto', minWidth: 0 }}>
          {demoUser && (
            <div style={{ background: '#FEF3C7', color: 'var(--point-ink)', borderRadius: 9999, padding: '4px 8px', fontSize: 12, fontWeight: 600, flexShrink: 0 }}>
              <span aria-hidden="true">◆</span> {demoUser.points.toLocaleString()}P
            </div>
          )}
          <button ref={searchButtonRef} aria-label="악보 검색" onClick={() => setSearchOpen(true)} style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 8, borderRadius: 8, color: '#64748B', display: 'flex' }}>
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          </button>
          <a href="#/notifications" className="hdr-desktop-only" aria-label={notifCount ? `알림, 읽지 않은 알림 ${notifCount}개` : '알림'} style={{ padding: 8, borderRadius: 8, color: '#64748B', position: 'relative', display: 'flex' }}>
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
            {notifCount > 0 && <span aria-hidden="true" style={{ position: 'absolute', top: 6, right: 6, width: 8, height: 8, background: '#EF4444', borderRadius: '50%', border: '1.5px solid white' }}></span>}
          </a>
          <a href="#/cart" className="hdr-desktop-only" aria-label={cartCount ? `장바구니, ${cartCount}개 담김` : '장바구니'} style={{ padding: 8, borderRadius: 8, color: '#64748B', position: 'relative', display: 'flex' }}>
            <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            {cartCount > 0 && <span aria-hidden="true" style={{ position: 'absolute', top: 3, right: 3, background: '#F97316', color: '#fff', borderRadius: '50%', minWidth: 16, height: 16, padding: '0 3px', fontSize: 10, fontWeight: 700, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{cartCount}</span>}
          </a>
          {demoUser ? (
            <div className="hdr-desktop-only" style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <span style={{ fontSize: 12, color: '#334155', whiteSpace: 'nowrap' }}>{demoUser.name}</span>
              <button onClick={onLogout} style={{ background: '#fff', color: '#64748B', border: '1px solid #E2E8F0', cursor: 'pointer', padding: '7px 10px', borderRadius: 8, fontSize: 12, fontWeight: 600, fontFamily: 'inherit' }}>로그아웃</button>
            </div>
          ) : (
            <a href="#/login" className="hdr-desktop-only" style={{ background: 'var(--accent-strong)', color: '#fff', padding: '7px 14px', borderRadius: 8, fontSize: 13, fontWeight: 600, textDecoration: 'none' }}>로그인</a>
          )}
        </div>
      </div>

      {searchOpen && (
        <div role="dialog" aria-modal="true" aria-label="악보 검색" style={{ position: 'fixed', inset: 0, background: 'rgba(15,23,42,0.6)', zIndex: 100, display: 'flex', alignItems: 'flex-start', padding: '80px 12px 0' }} onMouseDown={event => { if (event.target === event.currentTarget) closeSearch(); }}>
          <form onSubmit={submitSearch} style={{ background: '#fff', width: '100%', maxWidth: 600, margin: '0 auto', borderRadius: 16, padding: 20, boxShadow: '0 20px 48px rgba(0,0,0,0.18)' }}>
            <div style={{ display: 'flex', gap: 10, alignItems: 'center' }}>
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#64748B" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input autoFocus value={searchQuery} onChange={event => setSearchQuery(event.target.value)} placeholder="곡명, 아티스트, 편곡자 검색..." style={{ flex: 1, minWidth: 0, border: 'none', outline: 'none', fontSize: 16, fontFamily: 'inherit', color: '#0F172A' }} />
              <button type="button" aria-label="검색 닫기" onClick={closeSearch} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#64748B', fontSize: 20, padding: 8 }}>✕</button>
            </div>
            <div style={{ marginTop: 16 }}>
              <div style={{ fontSize: 11, fontWeight: 700, color: '#64748B', letterSpacing: '0.08em', marginBottom: 8 }}>검색어 예시</div>
              <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                {['한로로', '검정치마', 'AKMU', '아이유', '뉴진스'].map(term => (
                  <button type="button" key={term} style={{ background: '#F1F5F9', color: '#334155', border: 0, padding: '5px 12px', borderRadius: 9999, fontSize: 13, cursor: 'pointer', fontFamily: 'inherit' }} onClick={() => setSearchQuery(term)}>{term}</button>
                ))}
              </div>
            </div>
          </form>
        </div>
      )}
    </header>
  );
}

/* ─── ScoreCard sub-components ───────────────────────────── */
function DifficultyStars({ level = 3, size = 'sm' }) {
  const sz = size === 'sm' ? 13 : size === 'md' ? 16 : 20;
  return (
    <span style={{ fontSize: sz, color: '#FBBF24', letterSpacing: 1 }} aria-label={`난이도 ${level}/5`} role="img">
      {'★'.repeat(level)}{'☆'.repeat(5 - level)}
    </span>
  );
}

function Badge({ type, children }) {
  const styles = {
    free:   { background: '#D1FAE5', color: 'var(--free-ink)' },
    sale:   { background: '#FEE2E2', color: '#DC2626' },
    bundle: { background: '#E0E7FF', color: '#4F46E5' },
    new:    { background: '#1E293B', color: '#fff' },
  };
  return (
    <span style={{
      ...styles[type],
      padding: '2px 8px', borderRadius: 9999,
      fontSize: 10, fontWeight: 700, whiteSpace: 'nowrap', lineHeight: 1.6
    }}>{children}</span>
  );
}

function PriceDisplay({ price, discountPrice, isFree, large }) {
  const sz = large ? 20 : 15;
  if (isFree) return <span style={{ fontSize: sz, fontWeight: 700, color: 'var(--free-ink)' }}>무료</span>;
  if (discountPrice) return (
    <span style={{ display: 'flex', alignItems: 'baseline', gap: 4, flexWrap: 'wrap' }}>
      <span style={{ fontSize: 11, color: 'var(--ink-muted)', textDecoration: 'line-through' }}><span className="sr-only">정가 </span>{won(price)}</span>
      <span style={{ fontSize: sz, fontWeight: 700, color: 'var(--sale-ink)' }}><span className="sr-only">판매가 </span>{won(discountPrice)}</span>
    </span>
  );
  return <span style={{ fontSize: sz, fontWeight: 700, color: '#0F172A' }}>{won(price)}</span>;
}

const THUMB_GRADIENTS = [
  'linear-gradient(145deg,#1E293B,#334155)',
  'linear-gradient(145deg,#7C3AED,#4F46E5)',
  'linear-gradient(145deg,#065F46,#059669)',
  'linear-gradient(145deg,#991B1B,#DC2626)',
  'linear-gradient(145deg,#1E3A5F,#2563EB)',
  'linear-gradient(145deg,#312E81,#6366F1)',
];

function ScoreCard({ score, idx = 0 }) {
  const [wished, setWished] = useState(false);
  const [hovered, setHovered] = useState(false);
  const grad = score.thumbGradient || THUMB_GRADIENTS[idx % THUMB_GRADIENTS.length];
  const isBundle = score.type === 'bundle';
  const href = isBundle ? `#/bundle/${score.id}` : `#/score/${score.id}`;

  return (
    <article
      onMouseEnter={() => setHovered(true)}
      onMouseLeave={() => setHovered(false)}
      style={{
        width: '100%', background: '#fff', position: 'relative',
        border: '1px solid #E2E8F0', borderRadius: 12, overflow: 'hidden',
        transition: 'all 150ms ease-out',
        boxShadow: hovered ? '0 4px 12px rgba(0,0,0,0.12)' : '0 1px 3px rgba(0,0,0,0.06)',
        transform: hovered ? 'translateY(-2px)' : 'translateY(0)'
      }}>
      <a href={href} style={{ display: 'block', color: 'inherit', textDecoration: 'none' }}>
        <div style={{ position: 'relative', background: grad, aspectRatio: isBundle ? '16/9' : '3/4', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <span aria-hidden="true" style={{ fontSize: isBundle ? 36 : 48, opacity: 0.15 }}>{isBundle ? '📚' : '♪'}</span>
          <div style={{ position: 'absolute', top: 8, left: 8, display: 'flex', gap: 4, flexWrap: 'wrap' }}>
            {score.isFree && <Badge type="free">무료</Badge>}
            {score.isNew && <Badge type="new">NEW</Badge>}
            {score.discountPrice && !score.isFree && <Badge type="sale">할인 -{discountRate(score.price, score.discountPrice)}%</Badge>}
            {isBundle && <Badge type="bundle">악보집</Badge>}
          </div>
        </div>
        <div style={{ padding: '10px 12px 14px' }}>
          <div style={{ fontSize: 13, fontWeight: 600, color: '#0F172A', lineHeight: 1.35, marginBottom: 2, overflow: 'hidden', display: '-webkit-box', WebkitLineClamp: 2, WebkitBoxOrient: 'vertical' }}>
            {score.title}
          </div>
          <div style={{ fontSize: 11, color: '#64748B', marginBottom: 6 }}>
            {score.artist || score.subtitle}
          </div>
          {score.difficulty && <div style={{ marginBottom: 4 }}><DifficultyStars level={score.difficulty} /></div>}
          <PriceDisplay price={score.price} discountPrice={score.discountPrice} isFree={score.isFree} />
        </div>
      </a>
      {!isBundle && (
        <button aria-pressed={wished} aria-label={`${score.title} 찜하기`} onClick={() => setWished(!wished)} style={{
          position: 'absolute', top: 8, right: 8, zIndex: 2, background: 'rgba(15,23,42,.25)', border: 'none', borderRadius: '50%', width: 36, height: 36, cursor: 'pointer',
          color: wished ? 'var(--sale-ink)' : '#fff', fontSize: 18, lineHeight: 1
        }}>{wished ? '♥' : '♡'}</button>
      )}
    </article>
  );
}

/* ─── ScoreDetail ─────────────────────────────────────────── */
function ScoreDetail({ score, demoUser, onAddCart, onToast }) {
  const [wished, setWished] = useState(false);
  const pointBalance = demoUser?.points || 0;
  const canPayWithPoints = score && pointBalance >= (score.discountPrice || score.price || 0);

  if (!score) return null;
  const grad = score.thumbGradient || 'linear-gradient(145deg,#1E293B,#334155)';
  const rate = discountRate(score.price, score.discountPrice);
  const meta = [score.instrument, score.genre].filter(Boolean).join(' · ');
  const metrics = [
    score.key ? { label: '조성', value: score.key } : null,
    score.bpm ? { label: 'BPM', value: String(score.bpm) } : null,
    score.pages ? { label: '페이지', value: `${score.pages}p` } : null,
    score.format ? { label: '형식', value: score.format } : null,
  ].filter(Boolean);

  return (
    <div className="detail-page" style={{ background: '#F8FAFC', minHeight: '100vh', paddingBottom: 96 }}>
      <div style={{ background: grad, height: 280, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
        <span style={{ fontSize: 80, opacity: 0.12 }}>♪</span>
        <button aria-label="뒤로 가기" onClick={historyBackOrHome} style={{ position: 'absolute', top: 16, left: 16, background: 'rgba(255,255,255,0.15)', border: 'none', cursor: 'pointer', color: '#fff', borderRadius: 8, padding: '8px 12px', fontSize: 18, backdropFilter: 'blur(8px)' }}>←</button>
        <div style={{ position: 'absolute', bottom: 16, left: 16, display: 'flex', gap: 6 }}>
          {score.isFree && <span style={{ background: '#D1FAE5', color: 'var(--free-ink)', padding: '3px 10px', borderRadius: 9999, fontSize: 11, fontWeight: 700 }}>무료</span>}
          {rate > 0 && <span style={{ background: '#FEE2E2', color: 'var(--sale-ink)', padding: '3px 10px', borderRadius: 9999, fontSize: 11, fontWeight: 700 }}>할인 -{rate}%</span>}
        </div>
      </div>

      <div style={{ maxWidth: 640, margin: '0 auto', padding: '0 16px' }}>
        <div style={{ background: '#fff', borderRadius: 16, padding: '20px 20px 16px', marginTop: -24, boxShadow: '0 4px 12px rgba(0,0,0,0.08)', position: 'relative', zIndex: 2 }}>
          {meta && <div style={{ fontSize: 11, fontWeight: 700, color: 'var(--ink-muted)', letterSpacing: '0.06em', marginBottom: 4 }}>{meta}</div>}
          <h1 style={{ fontFamily: "'MaruBuri','Noto Serif KR',serif", fontSize: 22, fontWeight: 300, lineHeight: 1.3, color: '#0F172A', marginBottom: 4 }}>{score.title}</h1>
          <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12 }}>
            <span style={{ fontSize: 18, color: '#FBBF24', letterSpacing: 2 }}>
              {'★'.repeat(score.difficulty || 3)}{'☆'.repeat(5 - (score.difficulty || 3))}
            </span>
            <span style={{ fontSize: 12, color: 'var(--ink-muted)' }}>/</span>
            <span style={{ fontSize: 17, color: '#334155', letterSpacing: 2 }}>
              {'●'.repeat(score.technique || 2)}{'○'.repeat(5 - (score.technique || 2))}
            </span>
          </div>
          {(score.artist || score.arranger) && (
            <div style={{ fontSize: 13, color: '#64748B', marginBottom: 10 }}>
              {score.artist && <>아티스트: <strong style={{ color: '#334155' }}>{score.artist}</strong></>}
              {score.artist && score.arranger && ' · '}
              {score.arranger && <>편곡: <strong style={{ color: '#334155' }}>{score.arranger}</strong></>}
            </div>
          )}

          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            {score.discountPrice && <span style={{ fontSize: 14, color: 'var(--ink-muted)', textDecoration: 'line-through' }}><span className="sr-only">정가 </span>{won(score.price)}</span>}
            <span style={{ fontSize: 28, fontWeight: 700, color: score.isFree ? 'var(--free-ink)' : '#0F172A' }}>
              {score.isFree ? '무료' : won(score.discountPrice || score.price)}
            </span>
            {rate > 0 && <span style={{ background: '#FEE2E2', color: 'var(--sale-ink)', padding: '2px 8px', borderRadius: 9999, fontSize: 11, fontWeight: 700 }}>-{rate}%</span>}
          </div>

          {demoUser && canPayWithPoints && (
            <div style={{ background: '#FEF3C7', borderRadius: 8, padding: '8px 12px', marginTop: 10, fontSize: 12, color: 'var(--point-ink)' }}>
              <span aria-hidden="true">◆</span> 포인트로 구매 가능 — 보유 포인트: <strong>{pointBalance.toLocaleString()}P</strong>
            </div>
          )}
        </div>

        {metrics.length > 0 && <div style={{ background: '#fff', borderRadius: 12, padding: '14px 20px', marginTop: 12, display: 'flex', gap: 20, flexWrap: 'wrap', border: '1px solid #E2E8F0' }}>
          {metrics.map(m => (
            <div key={m.label} style={{ textAlign: 'center', flex: 1, minWidth: 56 }}>
              <div style={{ fontSize: 10, fontWeight: 700, color: 'var(--ink-muted)', letterSpacing: '0.06em', marginBottom: 2 }}>{m.label}</div>
              <div style={{ fontSize: 14, fontWeight: 600, color: '#334155' }}>{m.value}</div>
            </div>
          ))}
        </div>}

        <div style={{ background: '#fff', borderRadius: 12, padding: '14px 20px', marginTop: 12, border: '1px solid #E2E8F0' }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--ink-muted)', marginBottom: 8 }}>🎵 미리듣기 (30초)</div>
          <div style={{ background: '#F1F5F9', borderRadius: 8, padding: '10px 14px', display: 'flex', alignItems: 'center', gap: 10 }}>
            <button aria-label="미리듣기 재생" onClick={() => onToast('데모에서는 결제·다운로드·상담이 동작하지 않아요')} style={{ background: 'var(--accent-strong)', color: '#fff', border: 'none', cursor: 'pointer', borderRadius: '50%', width: 44, height: 44, fontSize: 12, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>▶</button>
            <div style={{ flex: 1, height: 3, background: '#E2E8F0', borderRadius: 2, position: 'relative' }}>
              <div style={{ width: '30%', height: '100%', background: '#F97316', borderRadius: 2 }}></div>
            </div>
            <span style={{ fontSize: 11, color: '#64748B', flexShrink: 0 }}>0:09 / 0:30</span>
          </div>
        </div>

        <div style={{ background: '#fff', borderRadius: 12, padding: '14px 20px', marginTop: 12, border: '1px solid #E2E8F0' }}>
          <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--ink-muted)', marginBottom: 8 }}>📄 샘플 미리보기 (1페이지)</div>
          <div style={{ background: '#F8FAFC', borderRadius: 8, height: 180, display: 'flex', alignItems: 'center', justifyContent: 'center', border: '1px dashed #CBD5E1' }}>
            <div style={{ textAlign: 'center', color: 'var(--ink-muted)' }}>
              <div style={{ fontSize: 32, marginBottom: 4 }}>♩ ♩ ♩ ♩</div>
              <div style={{ fontSize: 12 }}>워터마크 샘플 PDF (1p)</div>
            </div>
          </div>
        </div>

        <div style={{ marginTop: 12, display: 'flex', gap: 6, flexWrap: 'wrap' }}>
          {(score.tags || []).map(tag => (
            <span key={tag} style={{ background: '#F1F5F9', color: '#475569', padding: '4px 12px', borderRadius: 9999, fontSize: 12 }}>#{tag}</span>
          ))}
        </div>
      </div>

      <div className="detail-cta" style={{
        position: 'fixed', bottom: 56, left: 0, right: 0,
        background: '#fff', padding: '12px 16px',
        boxShadow: '0 -4px 16px rgba(0,0,0,0.08)',
        display: 'flex', gap: 8, maxWidth: 640, margin: '0 auto',
        zIndex: 30
      }}>
        <button aria-pressed={wished} aria-label={`${score.title} 찜하기`} onClick={() => setWished(!wished)} style={{
          background: 'none', border: '1.5px solid #E2E8F0', borderRadius: 10,
          padding: '0 16px', cursor: 'pointer', fontSize: 18,
          color: wished ? 'var(--sale-ink)' : 'var(--ink-muted)'
        }}>{wished ? '♥' : '♡'}</button>

        <button onClick={onAddCart} style={{
          flex: 1, background: '#F1F5F9', color: '#334155', border: 'none',
          borderRadius: 10, padding: '13px 0', cursor: 'pointer',
          fontFamily: 'inherit', fontWeight: 600, fontSize: 14
        }}>🛒 장바구니</button>

        {canPayWithPoints ? (
          <button onClick={() => go('/checkout/' + score.id)} style={{
            flex: 1.2, background: '#FBBF24', color: 'var(--point-ink)', border: 'none',
            borderRadius: 10, padding: '13px 0', cursor: 'pointer',
            fontFamily: 'inherit', fontWeight: 700, fontSize: 14
          }}>💰 포인트 결제</button>
        ) : (
          <button onClick={() => go('/checkout/' + score.id)} style={{
            flex: 1.2, background: 'var(--accent-strong)', color: '#fff', border: 'none',
            borderRadius: 10, padding: '13px 0', cursor: 'pointer',
            fontFamily: 'inherit', fontWeight: 700, fontSize: 14
          }}>{score.isFree ? '🎁 무료 다운로드' : '💳 바로구매'}</button>
        )}
      </div>
    </div>
  );
}

function BundleDetail({ bundle, onAddCart }) {
  const rate = discountRate(bundle.price, bundle.discountPrice);
  return (
    <div className="detail-page" style={{ background: '#F8FAFC', minHeight: '100vh', paddingBottom: 112 }}>
      <div style={{ background: bundle.thumbGradient, minHeight: 250, display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative' }}>
        <span aria-hidden="true" style={{ fontSize: 80, opacity: .16 }}>📚</span>
        <button aria-label="뒤로 가기" onClick={historyBackOrHome} style={{ position: 'absolute', top: 16, left: 16, background: 'rgba(255,255,255,.16)', color: '#fff', border: 0, borderRadius: 8, padding: '8px 12px', fontSize: 18, cursor: 'pointer' }}>←</button>
      </div>
      <div style={{ maxWidth: 640, margin: '-24px auto 0', padding: '0 16px', position: 'relative' }}>
        <section style={{ background: '#fff', borderRadius: 16, padding: 20, boxShadow: '0 4px 12px rgba(0,0,0,.08)' }}>
          <Badge type="bundle">악보집</Badge>
          <h1 style={{ fontFamily: "'MaruBuri','Noto Serif KR',serif", fontSize: 24, fontWeight: 300, margin: '10px 0 4px' }}>{bundle.title}</h1>
          <p style={{ color: '#64748B', fontSize: 14, marginBottom: 16 }}>{bundle.subtitle}</p>
          <div style={{ display: 'flex', alignItems: 'baseline', gap: 8 }}>
            <span style={{ color: 'var(--ink-muted)', textDecoration: 'line-through', fontSize: 14 }}><span className="sr-only">정가 </span>{won(bundle.price)}</span>
            <strong style={{ fontSize: 28 }}>{won(bundle.discountPrice)}</strong>
            <span style={{ background: '#FEE2E2', color: 'var(--sale-ink)', padding: '2px 8px', borderRadius: 9999, fontSize: 11, fontWeight: 700 }}>-{rate}%</span>
          </div>
        </section>
        <section style={{ background: '#fff', border: '1px solid #E2E8F0', borderRadius: 12, padding: 20, marginTop: 12 }}>
          <h2 style={{ fontFamily: "'MaruBuri','Noto Serif KR',serif", fontSize: 18, fontWeight: 300, marginBottom: 6 }}>수록곡</h2>
          <p style={{ color: '#64748B', fontSize: 14 }}>수록곡 목록은 준비 중이에요.</p>
        </section>
      </div>

function CheckoutPage({ product, demoUser, onOrderCreated }) {
  const [pointsUsed, setPointsUsed] = useState(0);
  const balance = demoUser?.points || 0;
  const price = product.discountPrice || product.price || 0;
  const remain = Math.max(0, price - pointsUsed);

  const updatePoints = (value) => setPointsUsed(clampPoints(value, balance, price));
  const handlePay = () => {
    const orderNo = createOrderNo();
    const paid = price - pointsUsed;
    const earned = Math.floor((paid * 3) / 100);
    const order = {
      orderNo, productId: product.id, title: product.title, price,
      pointsUsed, paid, earned, createdAt: new Date().toISOString()
    };
    sessionStorage.setItem('ss_last_order', JSON.stringify(order));
    onOrderCreated?.(order);
    go('/complete/' + orderNo);
  };

  return (
    <div style={{ maxWidth: 480, margin: '0 auto', padding: '20px 16px 100px', background: '#F8FAFC', minHeight: '100vh' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 20 }}>
        <button aria-label="뒤로 가기" onClick={historyBackOrHome} style={{ background: 'none', border: 'none', cursor: 'pointer', color: '#64748B', fontSize: 20, padding: 8 }}>←</button>
        <h2 style={{ fontSize: 20, fontWeight: 700, color: '#0F172A' }}>결제하기</h2>
      </div>
      <div style={{ background: '#fff', borderRadius: 12, padding: '16px 20px', marginBottom: 12, border: '1px solid #E2E8F0' }}>
        <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--ink-muted)', marginBottom: 8 }}>주문 상품</div>
        <div style={{ fontSize: 14, fontWeight: 600, color: '#0F172A' }}>{product.title}</div>
        <div style={{ fontSize: 16, fontWeight: 700, color: '#0F172A', marginTop: 6 }}>{won(price)}</div>
      </div>
      <div style={{ background: '#fff', borderRadius: 12, padding: '16px 20px', marginBottom: 12, border: '1px solid #E2E8F0' }}>
        {demoUser ? <>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
            <div style={{ fontSize: 12, fontWeight: 700, color: 'var(--ink-muted)' }}>포인트 사용</div>
            <span style={{ fontSize: 12, color: '#64748B' }}>보유: {balance.toLocaleString()}P</span>
          </div>
          <div style={{ display: 'flex', gap: 8 }}>
            <input aria-label="사용할 포인트" type="number" inputMode="numeric" min={0} max={Math.min(balance, price)} value={pointsUsed} onChange={event => updatePoints(event.target.value)}
              style={{ flex: 1, minWidth: 0, border: '1.5px solid #E2E8F0', borderRadius: 8, padding: '8px 12px', fontSize: 14, fontFamily: 'inherit', outline: 'none' }} />
            <button onClick={() => updatePoints(price)} style={{ background: '#FFF7ED', color: 'var(--accent-strong)', border: '1.5px solid var(--accent-strong)', borderRadius: 8, padding: '8px 14px', cursor: 'pointer', fontFamily: 'inherit', fontWeight: 600, fontSize: 13, whiteSpace: 'nowrap' }}>전액사용</button>
          </div>
        </> : <p style={{ fontSize: 14, color: '#64748B' }}>로그인하면 포인트를 쓸 수 있어요. <a href="#/login" style={{ color: 'var(--accent-strong)', fontWeight: 700 }}>로그인</a></p>}
      </div>
      <div style={{ background: '#fff', borderRadius: 12, padding: '16px 20px', marginBottom: 20, border: '1px solid #E2E8F0' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, color: '#64748B', marginBottom: 6 }}><span>상품 금액</span><span>{won(price)}</span></div>
        {pointsUsed > 0 && <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 14, color: 'var(--accent-strong)', marginBottom: 6 }}><span>포인트 할인</span><span>-{pointsUsed.toLocaleString()}P</span></div>}
        <div style={{ borderTop: '1px solid #F1F5F9', paddingTop: 8, display: 'flex', justifyContent: 'space-between', fontSize: 17, fontWeight: 700, color: '#0F172A' }}><span>결제 금액</span><span>{won(remain)}</span></div>
      </div>
      <p style={{ color: '#64748B', fontSize: 12, textAlign: 'center', marginBottom: 10 }}>UI 데모예요. 실제 결제·다운로드는 되지 않아요.</p>
      <button onClick={handlePay} style={{ width: '100%', background: remain === 0 ? '#FBBF24' : 'var(--accent-strong)', color: remain === 0 ? 'var(--point-ink)' : '#fff', border: 'none', borderRadius: 12, padding: '16px 0', fontSize: 16, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>
        {remain === 0 ? '◆ 포인트로 결제' : `${won(remain)} 결제하기`}
      </button>
    </div>
  );
}

/* ─── CompletePage ────────────────────────────────────────── */
function CompletePage({ orderNo, onToast }) {
  let order = null;
  try {
    const stored = JSON.parse(sessionStorage.getItem('ss_last_order') || 'null');
    if (stored?.orderNo === orderNo) order = stored;
  } catch (e) {}

  if (!order) return (
    <div style={{ maxWidth: 480, margin: '0 auto', padding: '60px 24px', textAlign: 'center', minHeight: '100vh' }}>
      <h1 style={{ fontFamily: "'MaruBuri','Noto Serif KR',serif", fontSize: 24, fontWeight: 300, marginBottom: 8 }}>주문 정보를 찾을 수 없어요</h1>
      <p style={{ color: '#64748B', fontSize: 14, marginBottom: 24 }}>이 브라우저에서 완료한 주문인지 확인해 주세요.</p>
      <a href="#/" style={{ display: 'inline-flex', background: 'var(--accent-strong)', color: '#fff', borderRadius: 10, padding: '12px 24px', textDecoration: 'none', fontWeight: 700 }}>홈으로</a>
    </div>
  );

  return (
    <div style={{ maxWidth: 480, margin: '0 auto', padding: '60px 24px', textAlign: 'center', background: '#F8FAFC', minHeight: '100vh' }}>
      <div aria-hidden="true" style={{ fontSize: 64, marginBottom: 16 }}>🎉</div>
      <h1 style={{ fontFamily: "'MaruBuri','Noto Serif KR',serif", fontSize: 24, fontWeight: 300, color: '#0F172A', marginBottom: 8 }}>결제 완료!</h1>
      <p style={{ fontSize: 14, color: '#64748B', marginBottom: 4 }}>{order.title}</p>
      <p style={{ fontSize: 13, color: 'var(--ink-muted)', marginBottom: 24 }}>주문번호: <span style={{ fontFamily: 'monospace' }}>{order.orderNo}</span></p>
      <div style={{ background: '#FEF3C7', borderRadius: 12, padding: '14px 20px', marginBottom: 24, fontSize: 14, color: 'var(--point-ink)', fontWeight: 600 }}>
        +{order.earned.toLocaleString()}P 포인트 적립 완료!
      </div>
      <button onClick={() => onToast('데모에서는 결제·다운로드·상담이 동작하지 않아요')} style={{ width: '100%', background: 'var(--accent-strong)', color: '#fff', border: 'none', borderRadius: 12, padding: '14px 0', fontSize: 15, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit', marginBottom: 10 }}>
        📄 악보 다운로드
      </button>
      <button onClick={() => go('/')} style={{ width: '100%', background: '#fff', color: '#64748B', border: '1px solid #E2E8F0', borderRadius: 12, padding: '14px 0', fontSize: 15, fontWeight: 600, cursor: 'pointer', fontFamily: 'inherit' }}>
        홈으로 돌아가기
      </button>
    </div>
  );
}

/* ─── Placeholder pages ───────────────────────────────────── */
const PAGE_LABELS = {
  cart: '장바구니', mypage: '마이페이지',
  notifications: '알림 센터', search: '검색', bundles: '악보집',
  free: '무료 악보',
};

function PlaceholderPage({ page }) {
  const label = PAGE_LABELS[page] || '카테고리';
  return (
    <div style={{ maxWidth: 480, margin: '0 auto', padding: '60px 24px', textAlign: 'center' }}>
      <div aria-hidden="true" style={{ fontSize: 48, marginBottom: 16 }}>🎵</div>
      <h1 style={{ fontFamily: "'MaruBuri','Noto Serif KR',serif", fontSize: 22, fontWeight: 300, color: '#0F172A', marginBottom: 8 }}>{label}</h1>
      <p style={{ fontSize: 14, color: 'var(--ink-muted)', marginBottom: 24 }}>UI 킷 프리뷰 — 이 화면은 추가 개발 예정입니다</p>
      <a href="#/" style={{ display: 'inline-flex', background: 'var(--accent-strong)', color: '#fff', borderRadius: 10, padding: '12px 24px', fontSize: 14, fontWeight: 700, textDecoration: 'none' }}>← 홈으로</a>
    </div>
  );
}

function LoginPage({ onLogin }) {
  return (
    <div style={{ maxWidth: 420, margin: '0 auto', padding: '72px 20px', textAlign: 'center' }}>
      <div aria-hidden="true" style={{ fontSize: 48, marginBottom: 12 }}>♪</div>
      <h1 style={{ fontFamily: "'MaruBuri','Noto Serif KR',serif", fontSize: 26, fontWeight: 300, marginBottom: 8 }}>로그인</h1>
      <p style={{ color: '#64748B', fontSize: 14, marginBottom: 24 }}>UI 데모에서는 간편하게 데모 회원으로 시작할 수 있어요.</p>
      <button onClick={onLogin} style={{ width: '100%', background: 'var(--accent-strong)', color: '#fff', border: 0, borderRadius: 10, padding: 14, fontSize: 15, fontWeight: 700, cursor: 'pointer', fontFamily: 'inherit' }}>데모 회원으로 둘러보기</button>
      <a href="#/" style={{ display: 'inline-block', marginTop: 16, color: '#64748B', fontSize: 14 }}>로그인 없이 계속</a>
    </div>
  );
}

function NotFound() {
  return (
    <div style={{ maxWidth: 480, margin: '0 auto', padding: '72px 24px', textAlign: 'center' }}>
      <h1 style={{ fontFamily: "'MaruBuri','Noto Serif KR',serif", fontSize: 26, fontWeight: 300, marginBottom: 8 }}>페이지를 찾을 수 없어요</h1>
      <p style={{ color: '#64748B', fontSize: 14, marginBottom: 24 }}>주소가 올바른지 확인하거나 홈에서 다시 시작해 주세요.</p>
      <a href="#/" style={{ display: 'inline-flex', background: 'var(--accent-strong)', color: '#fff', borderRadius: 10, padding: '12px 24px', textDecoration: 'none', fontWeight: 700 }}>홈으로</a>
    </div>
  );
}

/* ─── Root App ────────────────────────────────────────────── */
const PLACEHOLDER_PAGES = new Set(['search','cart','notifications','mypage','bundles','free']);
const CATEGORY_KEYS = new Set([...INSTRUMENTS, ...SIDEBAR_INSTRUMENTS].map(item => item.key.replace('category-', '')));

function App() {
  const route = useHashRoute();
  const isMobile = useMediaQuery('(max-width: 767px)');
  const [demoUser, setDemoUser] = useState(() => {
    try { return JSON.parse(sessionStorage.getItem('ss_demo_user') || 'null'); }
    catch (e) { return null; }
  });
  const [cartCount, setCartCount] = useState(0);
  const [toastMessage, setToastMessage] = useState('');
  const toastTimer = useRef(null);

  const selectedScore = route.name === 'score' ? SCORES.find(score => String(score.id) === route.param) : null;
  const selectedBundle = route.name === 'bundle' ? BUNDLES.find(bundle => String(bundle.id) === route.param) : null;
  const checkoutProduct = route.name === 'checkout'
    ? [...SCORES, ...BUNDLES].find(product => String(product.id) === route.param)
    : null;
  const page = route.name === 'score' ? 'detail'
    : route.name === 'bundle' ? 'bundle-detail'
    : route.name === 'category' ? `category-${route.param}`
    : route.name;

  const validRoute = route.name === 'home'
    || (route.name === 'score' && !!selectedScore)
    || (route.name === 'bundle' && !!selectedBundle)
    || (route.name === 'category' && CATEGORY_KEYS.has(route.param))
    || (route.name === 'checkout' && !!checkoutProduct)
    || (route.name === 'complete' && !!route.param)
    || route.name === 'points'
    || route.name === 'login'
    || PLACEHOLDER_PAGES.has(route.name);

  const showToast = (message) => {
    setToastMessage(message);
    if (toastTimer.current) clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToastMessage(''), 2500);
  };

  useEffect(() => () => { if (toastTimer.current) clearTimeout(toastTimer.current); }, []);

  const persistDemoUser = (user) => {
    setDemoUser(user);
    if (user) sessionStorage.setItem('ss_demo_user', JSON.stringify(user));
    else sessionStorage.removeItem('ss_demo_user');
  };
  const login = () => { persistDemoUser({ name: '데모 회원', points: 12300 }); go('/'); };
  const logout = () => { persistDemoUser(null); showToast('로그아웃했어요'); };
  const addCart = () => {
    setCartCount(count => count + 1);
    showToast('장바구니에 담았어요 (데모)');
  };
  const handleOrderCreated = (order) => {
    if (!demoUser) return;
    persistDemoUser({ ...demoUser, points: demoUser.points - order.pointsUsed + order.earned });
  };

  const hideChrome = page === 'complete' || page === 'checkout';

  return (
    <div style={{ minHeight: '100vh', background: '#F8FAFC' }}>
      {!hideChrome && <Header currentPage={page} cartCount={cartCount} notifCount={0} demoUser={demoUser} onLogout={logout} />}

      <main id="main" tabIndex={-1} style={{ paddingBottom: isMobile && !hideChrome ? 'calc(var(--tabbar-h) + env(safe-area-inset-bottom))' : 0 }}>
        {!validRoute && <NotFound />}
        {validRoute && page === 'home' && <HomePage onToast={showToast} />}
        {validRoute && page === 'detail' && <ScoreDetail score={selectedScore} demoUser={demoUser} onAddCart={addCart} onToast={showToast} />}
        {validRoute && page === 'bundle-detail' && <BundleDetail bundle={selectedBundle} onAddCart={addCart} />}
        {validRoute && page === 'points' && <PointCharge demoUser={demoUser} onToast={showToast} />}
        {validRoute && page === 'checkout' && <CheckoutPage product={checkoutProduct} demoUser={demoUser} onOrderCreated={handleOrderCreated} />}
        {validRoute && page === 'complete' && <CompletePage orderNo={route.param} onToast={showToast} />}
        {validRoute && page === 'login' && <LoginPage onLogin={login} />}
        {validRoute && route.name === 'category' && <PlaceholderPage page={page} />}
        {validRoute && PLACEHOLDER_PAGES.has(page) && <PlaceholderPage page={page} />}
      </main>

      {isMobile && !hideChrome && (
        <BottomTabBar currentPage={page} cartCount={cartCount} notifCount={0} />
      )}
      {toastMessage && <div className="toast-status" role="status">{toastMessage}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
